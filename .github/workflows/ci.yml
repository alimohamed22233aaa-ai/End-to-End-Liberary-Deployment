name: Build-Push Image to ghcr

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Build-Push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    outputs:
      short_tag: ${{ steps.vars.outputs.short_tag }}
      image: ${{ steps.vars.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate short commit tag
        id: vars
        run: |
          echo "short_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/library-app" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.short_tag }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.short_tag }}
            ${{ steps.vars.outputs.image }}:latest