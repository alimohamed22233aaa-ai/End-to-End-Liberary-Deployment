---
- name: Prepare all nodes
  hosts: k8s
  become: true
  roles:
    - common
    - containerd
    - kubernetes

- name: Initialize the control plane
  hosts: master
  become: true
  roles:
    - control_plane

- name: Install Calico CNI
  hosts: master
  become: false
  roles:
    - calico

- name: Join worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Verify the cluster
  hosts: master
  become: false
  roles:
    - verify