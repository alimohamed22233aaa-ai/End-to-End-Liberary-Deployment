name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
            context: ./app
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-app:${{ github.sha }}

      - name: Prepare SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Copy k8s files to node
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no \
            -J ${{ secrets.EC2_USER }}@${{ secrets.BASTION_HOST }} \
            -r k8s ${{ secrets.EC2_USER }}@${{ secrets.NODE_HOST }}:~/

      - name: Deploy on node
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no \
            -J ${{ secrets.EC2_USER }}@${{ secrets.BASTION_HOST }} \
            ${{ secrets.EC2_USER }}@${{ secrets.NODE_HOST }} "
            kubectl create secret generic library-secrets \
              --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
              --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
              --from-literal=POSTGRES_DB='${{ secrets.POSTGRES_DB }}' \
              --from-literal=SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              --dry-run=client -o yaml | kubectl apply -f -
            sed -i 's|IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/library-app:${{ github.sha }}|' ~/k8s/web.yaml
            kubectl apply -f ~/k8s/
            kubectl rollout status deployment/db --timeout=120s
            kubectl rollout status deployment/web --timeout=180s
          "