apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: library
  labels:
    app: web
spec:
 
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: web
          image: ali00mohamed/library-app:01818868a6379bbef0350b941e81653454420001
  
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "app:app"]
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: library-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: library-secret, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: library-secret, key: POSTGRES_DB } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: library-secret, key: SECRET_KEY } }
           
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet:
              path: /login
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
