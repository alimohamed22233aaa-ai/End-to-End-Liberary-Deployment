---
- name: Run kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_host }}
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ cri_socket }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for user
  ansible.builtin.file:
    path: "/home/{{ k8s_user }}/.kube"
    state: directory
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: "0755"

- name: Copy admin.conf to user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ k8s_user }}/.kube/config"
    remote_src: true
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: "0600"

- name: Get nodes
  ansible.builtin.command: kubectl get nodes
  become: false
  register: nodes_out
  changed_when: false

- name: Get kube-system pods
  ansible.builtin.command: kubectl get pods -n kube-system
  become: false
  register: pods_out
  changed_when: false

- name: Show nodes and pods
  ansible.builtin.debug:
    msg:
      - "{{ nodes_out.stdout_lines }}"
      - "{{ pods_out.stdout_lines }}"

# Generate join command (used later by the worker role)
- name: Create join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_output
  changed_when: false

- name: Save join command as a fact
  ansible.builtin.set_fact:
    join_command: "{{ join_output.stdout }}"