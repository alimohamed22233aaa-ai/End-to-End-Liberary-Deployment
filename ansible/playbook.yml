---
- name: Prepare all nodes
  hosts: k8s
  become: true

  tasks:
    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable persistent swap in fstab
      ansible.builtin.command: sed -i '/^[^#].* swap /s/^/#/' /etc/fstab
      changed_when: false

    - name: Load kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Load kernel modules on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Configure Linux forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false
    - name: Update apt cache
      ansible.builtin.command: apt-get update
      changed_when: false

    - name: Install containerd
      ansible.builtin.command: apt-get install -y containerd

    - name: Create containerd config directory
      ansible.builtin.command: mkdir -p /etc/containerd
      changed_when: false

    - name: Generate default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      changed_when: false

    - name: Set SystemdCgroup to true
      ansible.builtin.command: sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      changed_when: false

    - name: Enable and start containerd
      ansible.builtin.command: systemctl enable --now containerd
      changed_when: false

    - name: Restart containerd to apply config
      ansible.builtin.command: systemctl restart containerd
      changed_when: false

    - name: Check containerd version
      ansible.builtin.command: containerd --version
      register: containerd_version
      changed_when: false

    - name: Show containerd version
      ansible.builtin.debug:
        var: containerd_version.stdout  
    - name: Install packages needed for the Kubernetes repo
      ansible.builtin.command: apt-get install -y apt-transport-https ca-certificates curl gpg

    - name: Create keyrings directory
      ansible.builtin.command: mkdir -p -m 755 /etc/apt/keyrings
      changed_when: false

    - name: Download Kubernetes repo signing key
      ansible.builtin.shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | gpg --dearmor --batch --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      ansible.builtin.shell: echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      changed_when: false

    - name: Update apt cache again
      ansible.builtin.command: apt-get update
      changed_when: false

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.command: apt-get install -y kubelet kubeadm kubectl

    - name: Hold Kubernetes packages
      ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
      changed_when: false

    - name: Enable kubelet
      ansible.builtin.command: systemctl enable --now kubelet
      changed_when: false

    - name: Check kubeadm version
      ansible.builtin.command: kubeadm version -o short
      register: kubeadm_version
      changed_when: false

    - name: Show kubeadm version
      ansible.builtin.debug:
        var: kubeadm_version.stdout    
- name: Initialize the control plane
  hosts: master
  become: true

  tasks:
    - name: Run kubeadm init
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ ansible_host }}
        --pod-network-cidr=192.168.0.0/16
        --cri-socket=unix:///run/containerd/containerd.sock
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory for ubuntu user
      ansible.builtin.command: mkdir -p /home/ubuntu/.kube
      changed_when: false

    - name: Copy admin.conf to ubuntu user
      ansible.builtin.command: cp -f /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
      changed_when: false

    - name: Fix kubeconfig ownership
      ansible.builtin.command: chown ubuntu:ubuntu /home/ubuntu/.kube/config
      changed_when: false

    - name: Get nodes
      ansible.builtin.command: kubectl get nodes
      become: false
      register: nodes_out
      changed_when: false

    - name: Get kube-system pods
      ansible.builtin.command: kubectl get pods -n kube-system
      become: false
      register: pods_out
      changed_when: false

    - name: Show nodes and pods
      ansible.builtin.debug:
        msg:
          - "{{ nodes_out.stdout_lines }}"
          - "{{ pods_out.stdout_lines }}"    
- name: Install Calico CNI
  hosts: master
  become: false

  tasks:
    - name: Download Calico manifest
      ansible.builtin.command: curl -LO https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml
      args:
        chdir: /home/ubuntu
        creates: /home/ubuntu/calico.yaml

    - name: Disable IPIP mode
      ansible.builtin.command: sed -i '/CALICO_IPV4POOL_IPIP/{n;s/"Always"/"Never"/}' calico.yaml
      args:
        chdir: /home/ubuntu
      changed_when: false

    - name: Enable VXLAN mode
      ansible.builtin.command: sed -i '/CALICO_IPV4POOL_VXLAN/{n;s/"Never"/"Always"/}' calico.yaml
      args:
        chdir: /home/ubuntu
      changed_when: false

    - name: Apply Calico manifest
      ansible.builtin.command: kubectl apply -f calico.yaml
      args:
        chdir: /home/ubuntu

    - name: Wait for master node to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    - name: Get kube-system pods
      ansible.builtin.command: kubectl get pods -n kube-system
      register: calico_pods
      changed_when: false

    - name: Show pods
      ansible.builtin.debug:
        var: calico_pods.stdout_lines      
- name: Generate join command on master
  hosts: master
  become: true

  tasks:
    - name: Create join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_output
      changed_when: false

    - name: Save join command as a fact
      ansible.builtin.set_fact:
        join_command: "{{ join_output.stdout }}"

- name: Join worker nodes
  hosts: workers
  become: true

  tasks:
    - name: Run kubeadm join
      ansible.builtin.command: "{{ hostvars['master-node'].join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Verify the cluster
  hosts: master
  become: false

  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    - name: Get nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: final_nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: final_nodes.stdout_lines        